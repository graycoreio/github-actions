# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: "docker"
    directories:
      - "/angular-universal-vercel"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
    ignore:
      # Node major upgrades are a deliberate, released change.
      - dependency-name: "node"
        update-types:
          - version-update:semver-major
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/setup-node"
      - "/angular-universal-vercel-wflw-run"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
