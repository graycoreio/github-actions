name: nx-remote-cache Test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'nx-remote-cache/**'
      - '.github/workflows/_internal-nx-remote-cache.yml'
  push:
    branches:
      - main
    paths:
      - 'nx-remote-cache/**'
      - '.github/workflows/_internal-nx-remote-cache.yml'

# No `id-token: write`, on purpose: GitHub then provides no OIDC token, which is exactly the
# fork-PR situation the "no token" tests below exercise.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: shellcheck the action's script
        run: |
          yq '.runs.steps[0].run' nx-remote-cache/action.yml > "$RUNNER_TEMP/run.sh"
          shellcheck -s bash "$RUNNER_TEMP/run.sh"

  no-token-cache-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./nx-remote-cache
        with:
          server-url: https://cache.example
      - name: The remote cache must stay off
        run: |
          if [ -n "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:-}" ]; then
            echo "::error::expected no Nx remote cache variables without a token"; exit 1
          fi

  no-token-anonymous-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./nx-remote-cache
        with:
          server-url: https://cache.example/
          anonymous-read: true
      - name: Server URL set (trailing slash trimmed), no token
        run: |
          test "$NX_SELF_HOSTED_REMOTE_CACHE_SERVER" = https://cache.example
          test -z "${NX_SELF_HOSTED_REMOTE_CACHE_ACCESS_TOKEN:-}"

  no-token-local-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./nx-remote-cache
        with:
          mode: local
          storage-account: unused
          storage-container: unused
      - name: No server started, remote cache off
        run: |
          if [ -n "${NX_SELF_HOSTED_REMOTE_CACHE_SERVER:-}${NX_REMOTE_CACHE_CONTAINER:-}" ]; then
            echo "::error::expected no local server without a token"; exit 1
          fi
          test -z "$(docker ps -q --filter name=nx-remote-cache)"
